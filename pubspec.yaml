name: brightfret
description: BrightFret — freight tracking app for end clients (China → Cameroon/Africa).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0

  # Local storage
  hive_flutter: ^1.1.0

  # QR scanning
  mobile_scanner: ^5.2.3

  # Documents & images
  flutter_pdfview: ^1.3.2
  cached_network_image: ^3.4.1

  # Media
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  open_filex: ^4.4.0

  # UI
  google_fonts: ^6.2.1

  # i18n
  intl: ^0.19.0

  # Deep links
  app_links: ^6.3.2

  # Network status
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  custom_lint: ^0.6.7
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/forwarders.json
    - assets/images/

  generate: true
